<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080"><defs><marker id="a" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#927442"/></marker></defs><rect width="1200" height="1080" fill="#faf9f4"/><style>text{font-family:Arial,sans-serif;fill:#263238;font-size:16px}.title{font-size:27px;font-weight:bold}.sub{fill:#59676b;font-size:14px}.dim{font-size:15px;fill:#785c28}.small{font-size:13px}.line{fill:none;stroke:#405a65;stroke-width:2}.dimension{fill:none;stroke:#927442;stroke-width:1.4;marker-start:url(#a);marker-end:url(#a)}</style><text x="40" y="46" class="title">A0 power and communications wiring</text><text x="40" y="75" class="sub">Low-voltage topology. Full-globe electronics remain on hold pending layout and hardware qualification.</text><rect x="40" y="110" width="230" height="85" rx="8" fill="#e9e9dd" stroke="#6e807f"/><text x="54" y="136" font-weight="bold">External 12 V / ~36 W</text><text x="54" y="160" class="small">Certified enclosed adapter</text><text x="54" y="181" class="small">M8 inlet → 2 A main fuse</text><rect x="335" y="110" width="245" height="85" rx="8" fill="#e9e9dd" stroke="#6e807f"/><text x="349" y="136" font-weight="bold">INA260 0x40</text><text x="349" y="160" class="small">IN+ from fused 12 V</text><text x="349" y="181" class="small">IN− to relay COM; GND common</text><rect x="655" y="110" width="225" height="85" rx="8" fill="#e9e9dd" stroke="#6e807f"/><text x="669" y="136" font-weight="bold">Normally-open relay</text><text x="669" y="160" class="small">COM → NO only on enable</text><text x="669" y="181" class="small">DC-rated 5 V coil candidate</text><rect x="945" y="110" width="210" height="140" rx="8" fill="#e9e9dd" stroke="#6e807f"/><text x="959" y="136" font-weight="bold">Two power branches</text><text x="959" y="160" class="small">A: 750 mA fuse → 10 sectors</text><text x="959" y="181" class="small">B: 750 mA fuse → 10 sectors</text><text x="959" y="202" class="small">12 V, GND trunk</text><text x="959" y="223" class="small">350 mA PTC at each sector</text><path d="M270,153 H335 M580,153 H655 M880,153 H945" fill="none" stroke="#ad7738" stroke-width="3"/><rect x="40" y="295" width="230" height="105" rx="8" fill="#e9e9dd" stroke="#6e807f"/><text x="54" y="321" font-weight="bold">Independent 5 V regulator</text><text x="54" y="345" class="small">From fused 12 V before relay</text><text x="54" y="366" class="small">Powers Pi and relay coil</text><text x="54" y="387" class="small">Qualify 5 V / 2 A capacity</text><path d="M298,153 V347 H270" fill="none" stroke="#ad7738" stroke-width="3"/><rect x="335" y="295" width="245" height="150" rx="8" fill="#e9e9dd" stroke="#6e807f"/><text x="349" y="321" font-weight="bold">Pi Zero 2 W</text><text x="349" y="345" class="small">GPIO2 SDA / GPIO3 SCL</text><text x="349" y="366" class="small">GPIO17 → 1k → NPN base</text><text x="349" y="387" class="small">USB → RS-485 adapter</text><text x="349" y="408" class="small">FRAM 0x50 on 3.3 V I²C</text><text x="349" y="429" class="small">Common low-voltage GND</text><path d="M270,347 H335" fill="none" stroke="#ad7738" stroke-width="3"/><path d="M458,295 V195" fill="none" stroke="#5f8588" stroke-width="3"/><rect x="655" y="295" width="225" height="150" rx="8" fill="#e9e9dd" stroke="#6e807f"/><text x="669" y="321" font-weight="bold">Relay coil driver</text><text x="669" y="345" class="small">+5 V → coil → NPN collector</text><text x="669" y="366" class="small">Emitter to GND; 100k B–E</text><text x="669" y="387" class="small">Flyback diode across coil</text><text x="669" y="408" class="small">Cathode at +5 V</text><text x="669" y="429" class="small">Never drive coil from GPIO</text><path d="M580,365 H655" fill="none" stroke="#5f8588" stroke-width="3"/><path d="M768,295 V195" fill="none" stroke="#ad7738" stroke-width="3"/><rect x="945" y="295" width="210" height="150" rx="8" fill="#e9e9dd" stroke="#6e807f"/><text x="959" y="321" font-weight="bold">Each sector ×20</text><text x="959" y="345" class="small">350 mA PTC → 3.3 V buck</text><text x="959" y="366" class="small">3.3 V → tile / logic rail</text><text x="959" y="387" class="small">Schottky diode → Pico VSYS</text><text x="959" y="408" class="small">USB isolated from tile rail</text><text x="959" y="429" class="small">DS18B20 local sensor</text><path d="M1050,250 V295" fill="none" stroke="#ad7738" stroke-width="3"/><rect x="40" y="530" width="315" height="130" rx="8" fill="#e9e9dd" stroke="#6e807f"/><text x="54" y="556" font-weight="bold">One RS-485 daisy chain</text><text x="54" y="580" class="small">Master end: 120 Ω termination</text><text x="54" y="601" class="small">Bias once: 330 Ω A→3V3, B→GND</text><text x="54" y="622" class="small">Twisted pair A/B plus ground reference</text><text x="54" y="643" class="small">120 Ω only at final sector; verify A/B</text><path d="M455,445 V493 H197 V530" fill="none" stroke="#5f8588" stroke-width="3"/><rect x="425" y="530" width="330" height="130" rx="8" fill="#e9e9dd" stroke="#6e807f"/><text x="439" y="556" font-weight="bold">Sector Pico + 3.3 V transceiver</text><text x="439" y="580" class="small">GP4 TX → DI; GP5 RX ← RO</text><text x="439" y="601" class="small">GP6 → DE and /RE; 10k pull-down</text><text x="439" y="622" class="small">GP15 → DS18B20 data, 4.7k pull-up</text><text x="439" y="643" class="small">GP10–13 → branch SDB; 10k down</text><path d="M355,595 H425" fill="none" stroke="#5f8588" stroke-width="3"/><rect x="825" y="530" width="330" height="130" rx="8" fill="#e9e9dd" stroke="#6e807f"/><text x="839" y="556" font-weight="bold">TCA9548A at 0x70</text><text x="839" y="580" class="small">GP0 SDA, GP1 SCL; 100 kHz</text><text x="839" y="601" class="small">GP14 reset + 10k pull-up; A0–A2 GND</text><text x="839" y="622" class="small">Upstream pull-up pair (account for module)</text><text x="839" y="643" class="small">4 downstream buses × ≤4 addresses</text><path d="M755,595 H825" fill="none" stroke="#5f8588" stroke-width="3"/><path d="M1050,445 V530" fill="none" stroke="#ad7738" stroke-width="3"/><rect x="825" y="735" width="330" height="140" rx="8" fill="#e9e9dd" stroke="#6e807f"/><text x="839" y="761" font-weight="bold">One branch → tile daisy chain</text><text x="839" y="785" class="small">6-pin JST-SH: 1 3V3 · 2 GND · 3 SDA</text><text x="839" y="806" class="small">4 SCL · 5 SDB · 6 INTB provision</text><text x="839" y="827" class="small">One 2.2k SDA/SCL pull-up pair per bus</text><text x="839" y="848" class="small">Exactly one JP per tile: 0x30–0x33</text><text x="839" y="869" class="small">Target total branch cable ≤350 mm</text><path d="M990,660 V735" fill="none" stroke="#5f8588" stroke-width="3"/><rect x="40" y="735" width="700" height="140" rx="8" fill="#e9e9dd" stroke="#6e807f"/><text x="54" y="761" font-weight="bold">Ten-cell bench is a separate, simple circuit</text><text x="54" y="785" class="small">USB → Pico only; GP0–GP9 → matching pads 0–9</text><text x="54" y="806" class="small">Each pad → 1 kohm resistor → one LED anode; all cathodes → common GND</text><text x="54" y="827" class="small">No matrix IC, 12 V input, relay or sector controller is used for this test</text><text x="54" y="848" class="small">Load firmware/ten-cell-bench; outsource the tiny surface-mount assembly</text><text x="40" y="937" font-weight="bold">Harness: use the tile, sector and I²C schedules. Check continuity and polarity before power.</text><text x="40" y="967" class="sub">Route the two fused +12 V feeds, ground and RS-485 pair through the deburred spine port. Add strain relief.</text><text x="40" y="992" class="sub">Power trunk: nominal AWG24; pair: flexible twisted insulated wire. Confirm voltage drop, connector current and cable fit.</text><text x="40" y="1017" class="sub">The software guard is not a certified safety circuit. Fuses, PTCs, external pull-downs and hardware fault tests are required.</text><text x="40" y="1042" class="sub">SDB / I²C behavior, real module envelopes, electrical schematic/ERC and full matrix routing remain release holds.</text></svg>