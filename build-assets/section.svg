<g font-size="17" fill="#e4bf81"><text x="735" y="120">Matte charcoal finish</text><text x="735" y="207">Translucent terrain shell</text><text x="735" y="294">Opaque light cells</text><text x="735" y="384">Dense amber LED tile</text><text x="735" y="452">Independent support frame</text></g>
<g font-size="13" fill="#b2bfb7"><text x="735" y="143">Tint and clear coat chosen by sample</text><text x="735" y="230">Inner wall needs thickness validation</text><text x="735" y="317">Fit to underside; control spill and gaps</text><text x="735" y="407">Map each cell to a geographic area</text><text x="735" y="475">Removable mounts, wiring and service access</text></g>
<text x="40" y="520" font-size="15" fill="#e4bf81">25× terrain: up to 3.73 mm raised in the current grid.</text>
<text x="40" y="548" font-size="14" fill="#b2bfb7">50-mile footprint: 3.85 mm diameter. Target final cell pitch: 2.0–2.5 mm.</text>
<text x="40" y="576" font-size="13" fill="#b2bfb7">The supplied curved samples use a smooth inner wall; the illustrated terrain-following wall is not yet production CAD.</text>
