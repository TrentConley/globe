<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">Proposed globe optical stack</title><desc id="desc">A dark, terrain-shaped translucent shell over opaque optical cells and a dense LED tile. The terrain-following inner wall is a production investigation; the supplied test shell has a smooth inside. Drawing is not to scale.</desc>
